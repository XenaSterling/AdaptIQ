version: "3.9"

services:
  db:
    image: postgres:15
    container_name: adaptiq_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: adaptiq
    ports:
      - "5432:5432"
    volumes:
      - adaptiq_postgres_data:/var/lib/postgresql/data

volumes:
  adaptiq_postgres_data: