[tool.poetry]
name = "adaptIQ-backend"
version = "1.0.0"
description = "AdaptIQ project backend"
authors = ["raquel.delcastillo.perez"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.136.1,<0.137.0"
uvicorn = ">=0.46.0,<0.47.0"
sqlalchemy = ">=2.0.49,<3.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
python-jose = { extras = ["cryptography"], version = ">=3.5.0,<4.0.0" }
passlib = { extras = ["bcrypt"], version = ">=1.7.4,<2.0.0" }
bcrypt = ">=5.0.0,<6.0.0"
argon2-cffi = ">=25.1.0,<26.0.0"
scikit-learn = ">=1.8.0,<2.0.0"
email-validator = "^2.3.0"
pydantic-settings = "^2.14.1"
python-dotenv = "^1.2.2"
numpy = "2.4.4"
pydantic = "2.13.3"
joblib = "1.5.3"

[tool.poetry.group.dev.dependencies]
deptry = "0.25.1"
httpx = ">=0.28.1,<0.29.0"
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pyinstaller = { version = "^6.22.3", python = ">=3.11,<3.16" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
